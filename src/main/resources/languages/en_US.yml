# ============================================================================
#  UltimateCombat - English messages (en_US)
#
#  Do not edit this file to customise texts - plugin updates may replace it.
#  Copy the keys you want to change into languages/custom.yml instead.
#
#  Formats per message:
#    key: "text"                 -> one chat line
#    key: ["line 1", "line 2"]   -> several chat lines
#    key: ""                     -> message disabled
#    key:
#      chat: "text"              -> chat (optional)
#      actionbar: "text"         -> action bar (optional)
#      title: "text"             -> title (optional)
#      subtitle: "text"          -> subtitle (optional)
#      fade-in: 10               -> title fade in (ticks)
#      stay: 40                  -> title duration (ticks)
#      fade-out: 10              -> title fade out (ticks)
#      sound: combat-start       -> sound preset from sounds.yml (optional)
#      prefix: true              -> put the prefix in front of chat lines
#
#  Colours: &a &l ..., hex &#FF5555, MiniMessage <gradient:...> (Paper).
#  {placeholders} are listed above each message; %PlaceholderAPI% works too.
# ============================================================================

general:
  # {module}
  module-disabled: "&cThis feature ({module}) is disabled on this server."
  no-permission: "&cYou do not have permission to do that."
  player-only: "&cOnly players can use this command."
  # {usage}
  usage: "&cUsage: &f{usage}"
  # {player}
  player-not-found: "&cPlayer &f{player} &cwas not found."
  # {value} {min} {max}
  invalid-number: "&cInvalid number &f{value}&c. Allowed: &f{min}&c - &f{max}&c."
  internal-error: "&cAn internal error occurred. Please tell an administrator (see console)."
  data-load-failed: "Your data could not be loaded. Please try again in a moment."
  storage-unavailable: "&cThe database is not available right now."

help:
  # {command}
  header: "&8&m          &r &cUltimateCombat &8- &f/{command} &8&m          "
  # {command} {description}
  entry: "&c/{command} &8- &7{description}"
  descriptions:
    help: "Show this help"
    reload: "Reload configuration files"
    validate: "Check every configuration file for problems"
    config: "Read, explain or change a setting"
    migrate: "Add new settings to your files (backup first)"
    backup: "Back up every configuration file"
    status: "Show plugin status"
    version: "Show the plugin version"
    debug: "Toggle live debug output"
    integrations: "Show detected plugin integrations"
    tag: "Put a player into combat"
    untag: "Remove a player from combat"
    combat: "Show combat status"
    combatlog: "Combat log history and pending punishments"
    ghosts: "Manage ghost players"
    border: "Manage built-in no-PvP zones"
    oldpvp: "Switch between classic and modern combat"
    togglepvp: "Turn your PvP on or off"
    pvp: "Admin PvP state management"
    grace: "New player protection"
    bounty: "Player bounties"
    stats: "Show PvP statistics"
    points: "Show PvP points"
    leaderboard: "Show the leaderboard"
    deathback: "Return to your last death location"
    spawnpoint: "Manage spawn points"
    killrecaps: "Show your recent kill recaps"
    stattrak: "Weapon kill counters"
    sellhead: "Sell a head trophy"
    potionstack: "Stack the potions in your inventory"
    pvp-interval: "Show PvP time windows"
    apple: "Golden apple settings"
    potion: "Potion restrictions"
    enchantment: "Enchantment restrictions"
    totem: "Totem settings"
    rewards: "Trigger reward rules"
    menu: "Open the administration menu"
    abuse: "Anti-abuse review"
    resetstats: "Reset statistics"
    exportstats: "Export statistics to a CSV file"
    corpses: "Manage corpses"

gui:
  # {word}
  prompt-cancel-hint: "&7Type &f{word} &7to cancel."
  prompt-cancel-word: "cancel"
  prompt-cancelled: "&7Input cancelled."
  prompt-expired: "&cThe input request expired."

admin:
  # {version} {platform} {minecraft}
  version: "&7UltimateCombat &f{version} &7on &f{platform} {minecraft}"
  reload:
    # {target} {time}
    done: "&aReloaded &f{target} &ain &f{time}ms&a."
    # {count}
    issues: "&e{count} configuration problem(s) found - safe fallbacks are used. Run &f/uc validate&e."
    # {target}
    unknown-target: "&cUnknown reload target &f{target}&c. Use all, messages, a module name or a file name."
    # {file}
    restart-required: "&e{file} changed - this file only applies after a full server restart."
  validate:
    # {files}
    ok: "&aAll {files} configuration files are valid."
    # {count}
    header: "&e{count} configuration problem(s):"
    # {issue}
    entry: "&e- &7{issue}"
    # {issue}
    error: "&c- {issue}"
    # {count}
    more: "&7... and {count} more (see console)."
    # {count}
    missing: "&7{count} newer setting(s) are missing in your files (defaults used). &f/uc migrate &7adds them."
  config:
    # {file} {path}
    explain-header: "&c{file} &8> &f{path}"
    explain-line: "&7{line}"
    no-documentation: "&7No documentation found for this setting."
    # {value}
    current: "&7Current value: &f{value}"
    # {file} {path} {value} {source}
    value: "&c{file} &8> &f{path} &7= &f{value} &8({source})"
    # {path} {file}
    unknown-path: "&c{path} does not exist in {file}."
    # {path}
    is-section: "&c{path} is a section; change the settings inside it."
    # {value} {type}
    wrong-type: "&c'{value}' is not valid here. Expected: {type}."
    # {file}
    write-failed: "&cCould not write {file} (does it contain a YAML error?)."
    # {reason}
    rejected: "&cThe value was rejected and the old value restored: &7{reason}"
    # {file} {path} {value}
    updated: "&a{file} > {path} is now &f{value}&a (backup created)."
    # {reference}
    bad-reference: "&cUse file:path, for example combat.yml:pvp.duration-seconds (got {reference})."
  backup:
    # {count}
    done: "&aBacked up {count} files into plugins/UltimateCombat/backups/."
  migrate:
    # {file} {count}
    preview-file: "&7{file}: &f{count} &7new setting(s) would be added."
    # {file} {count}
    file: "&a{file}: added {count} setting(s)."
    # {file}
    failed: "&c{file}: could not be migrated (YAML error?)."
    # {change}
    structural: "&7{change}"
    # {count}
    done: "&aMigration finished, {count} setting(s) added. Backups are in backups/."
  status:
    # {version}
    header: "&8&m       &r &cUltimateCombat {version} status &8&m       "
    # {platform} {minecraft} {java}
    platform: "&7Server: &f{platform} {minecraft} &7Java &f{java}"
    # {type} {group} {redis}
    storage: "&7Storage: &f{type} &7group &f{group} &7Redis: {redis}"
    # {count} {list}
    modules-on: "&7Active modules ({count}): &a{list}"
    # {count} {list}
    modules-off: "&7Disabled modules ({count}): &8{list}"
    # {count}
    issues: "&7Configuration problems: &f{count}"
    # {count} {profiles}
    players: "&7Online players: &f{count} &7(loaded profiles: {profiles})"
  debug:
    enabled: "&aLive debug output enabled for you."
    disabled: "&7Live debug output disabled."
    console-hint: "&7Use config.yml -> debug.enabled for console debug output."
    # {count}
    counters-header: "&7Debug counters ({count}):"
    # {name} {value}
    counter: "&8- &7{name}: &f{value}"
  integrations:
    header: "&7Plugin integrations:"
    # {name} {id} {detail}
    active: "&a✔ {name} &8({id}) &7{detail}"
    disabled: "&8✖ {name} &8({id}) - disabled in integrations.yml"
    missing: "&8- {name} &8({id}) - not installed"
    failed: "&c✖ {name} &8({id}) &c- failed: {detail}"

combat:
  pvp:
    # {player} {opponent} {time} {type}
    start-attacker:
      chat: "&cYou attacked &f{opponent}&c - you are in combat for &f{time}s&c. Do not log out!"
    start-victim:
      chat: "&cYou were attacked by &f{opponent}&c - you are in combat for &f{time}s&c. Do not log out!"
  pve:
    # {player} {opponent} {time} {type}
    start: "&eYou are now in PvE combat with &f{opponent}&e for &f{time}s&e."
  # {player} {type} {opponent}
  end: "&aYou are no longer in combat."
  end-other: "&aYou are no longer in combat."
  actionbar:
    # {time} {bar} {opponent} {type} {player}
    pvp: "&c&lCOMBAT &8| {bar} &8| &f{time}s"
    pve: "&e&lPVE &8| {bar} &8| &f{time}s"
    end: "&a&lYou are no longer in combat"
  bossbar:
    # {time} {bar} {opponent} {type} {player}
    pvp: "&cIn combat with &f{opponent} &8- &f{time}s"
    pve: "&eFighting &f{opponent} &8- &f{time}s"
  # {player}
  third-party-blocked: "&c{player} is already fighting someone else."
  kill-steal-blocked: "&cYou cannot steal the kill of {player}."
  admin:
    # {player} {time} {type}
    tagged: "&a{player} is now in {type} combat ({time}s)."
    tag-failed: "&c{player} could not be tagged (world, game mode or another plugin prevented it)."
    # {player}
    untagged: "&a{player} is no longer in combat."
    not-tagged: "&7{player} is not in combat."
    # {count}
    untagged-all: "&aRemoved {count} player(s) from combat."
  status:
    # {player} {time} {type} {opponents}
    in-combat: "&cYou are in {type} combat for &f{time}s &cagainst &f{opponents}&c."
    not-in-combat: "&aYou are not in combat."
    other-in-combat: "&c{player} is in {type} combat for &f{time}s &cagainst &f{opponents}&c."
    other-not-in-combat: "&a{player} is not in combat."

cooldowns:
  # {item} {time}
  active: "&cYou cannot use &f{item} &cfor another &f{time}s&c."
  actionbar: "&c{item}: &f{time}s"
  # {item}
  ready: "&a{item} is ready again."
  ready-actionbar: "&a{item} ready"

restrictions:
  # {command} {time}
  command-blocked: "&cYou cannot use &f{command} &cwhile in combat (&f{time}s&c left)."
  command-disabled: "&cThe command &f{command} &cis disabled."
  # {player} {action} {time}
  missing-permission: "&cYou are not allowed to use {action}."
  flight-disabled: "&cYour flight was disabled because you entered combat."
  flight-restored: "&aYou can fly again."
  gamemode-reset: "&cYou were put into survival mode because you entered combat."
  godmode-disabled: "&cGod mode was disabled because you entered combat."
  vanish-disabled: "&cYou are visible again because you entered combat."
  disguise-removed: "&cYour disguise was removed because you entered combat."
  # Messages when an action is blocked. {player} {action} {time}
  blocked:
    flight: "&cYou cannot fly while in combat."
    elytra: "&cYou cannot use an elytra while in combat."
    riptide: "&cYou cannot use riptide while in combat."
    creative: "&cYou cannot change your game mode while in combat."
    god-mode: "&cYou cannot use god mode while in combat."
    vanish: "&cYou cannot vanish while in combat."
    disguise: "&cYou cannot disguise while in combat."
    teleport: "&cYou cannot teleport while in combat."
    containers: "&cYou cannot open this while in combat."
    block-break: "&cYou cannot break blocks while in combat."
    block-place: "&cYou cannot place blocks while in combat."
    sleeping: "&cYou cannot sleep while in combat."
    armor-switching: "&cYou cannot change your armour while in combat."
    inventory: "&cYou cannot use your inventory while in combat."
    mending: "&cMending does not work while in combat."
    enchanting: "&cYou cannot enchant while in combat."
    potions: "&cYou cannot use potions while in combat."
    ender-pearls: "&cYou cannot throw ender pearls while in combat."
    chorus-fruit: "&cYou cannot eat chorus fruit while in combat."
    golden-apples: "&cYou cannot eat golden apples while in combat."
    enchanted-golden-apples: "&cYou cannot eat enchanted golden apples while in combat."
    totems: "&cTotems of Undying do not work while in combat."
    shields: "&cYou cannot use shields while in combat."
    tnt: "&cYou cannot use TNT while in combat."
    wind-charges: "&cYou cannot use wind charges while in combat."
    custom-items: "&cYou cannot use this item while in combat."
    entity-interactions: "&cYou cannot interact with that while in combat."
  # Readable names of restricted actions ({action}, cooldown messages).
  names:
    flight: "Flight"
    elytra: "Elytra"
    riptide: "Riptide"
    creative: "Creative mode"
    god-mode: "God mode"
    vanish: "Vanish"
    disguise: "Disguise"
    teleport: "Teleport"
    containers: "Containers"
    block-break: "Block breaking"
    block-place: "Block placing"
    sleeping: "Sleeping"
    armor-switching: "Armour switching"
    inventory: "Inventory"
    mending: "Mending"
    enchanting: "Enchanting"
    potions: "Potions"
    ender-pearls: "Ender Pearl"
    chorus-fruit: "Chorus Fruit"
    golden-apples: "Golden Apple"
    enchanted-golden-apples: "Enchanted Golden Apple"
    totems: "Totem of Undying"
    shields: "Shield"
    tnt: "TNT"
    wind-charges: "Wind Charge"
    custom-items: "this item"
    entity-interactions: "Entity interaction"

combatlog:
  # {player} {opponent} {world} {x} {y} {z} {type} {time}
  quit-message: "&c{player} &7logged out during combat."
  broadcast: "&c&l{player} &clogged out while in combat!"
  broadcast-location: "&c&l{player} &clogged out while in combat at &f{world} {x}, {y}, {z}&c!"
  opponent-logged: "&e{player} logged out while fighting you."
  # {amount} {player}
  money-received: "&aYou received &f{amount} &afrom {player}'s combat log penalty."
  # {player}
  death-message: "&c{player} was killed for logging out in combat."
  # {player} {opponent} {ago}
  rejoin: "&cYou logged out during combat {ago} ago and were punished."
  rejoin-killed: "&cYou logged out during combat {ago} ago and have been killed."
  rejoin-broadcast: "&7{player}, who logged out in combat, is back."
  history:
    # {player} {count}
    header: "&7Last {count} combat logs of &f{player}&7:"
    # {date} {world} {location} {type} {opponent} {punishment}
    entry: "&8- &f{date} &7{type} vs &f{opponent} &7at {world} {location} &8({punishment})"
  pending:
    # {type} {date}
    entry: "&8- &f{type} &7since {date}"
    # {player} {count}
    total: "&7{player} has {count} pending punishment(s)."
    cleared: "&aRemoved {count} pending punishment(s) of {player}."

ghosts:
  # {player}
  name: "&c{player} &7(logged out)"
  # {player} {time}
  spawned: "&c{player} logged out in combat - their ghost stays for {time}s. Kill it for their loot!"
  # {player} {killer}
  killed: "&c{killer} killed the ghost of {player}!"
  survived: "&aYour ghost survived - you keep your items."
  # {killer}
  rejoin-killed: "&cYour ghost was killed by {killer} while you were offline. Your items were dropped."
  # {count} {halted}
  list-header: "&7Active ghosts: &f{count} &7(spawning halted: {halted})"
  # {player} {world} {x} {y} {z}
  list-entry: "&8- &f{player} &7at {world} {x}, {y}, {z}"
  removed: "&aRemoved the ghost of {player}."
  not-found: "&c{player} has no ghost."
  halted: "&eGhost players will not spawn until /uc ghosts resume."
  resumed: "&aGhost players spawn again."

borders:
  blocked: "&cYou cannot escape while in combat!"
  zone-no-pvp: "&cPvP is disabled in this area."
  # {number} {x} {y} {z}
  position-set: "&aPosition {number} set to {x}, {y}, {z}."
  selection-incomplete: "&cSet both positions in the same world first (/uc border pos1, /uc border pos2)."
  # {name}
  zone-created: "&aZone {name} created (borders.yml)."
  zone-deleted: "&aZone {name} deleted."
  zone-unknown: "&cThere is no zone named {name}."
  # {count}
  zone-list-header: "&7No-PvP zones: &f{count}"
  # {name} {world} {min} {max}
  zone-list-entry: "&8- &f{name} &7{world} {min} -> {max}"

oldpvp:
  enabled: "&aYou now use classic (1.8) combat."
  disabled: "&aYou now use modern combat."
  toggle-disabled: "&cPlayers cannot choose their combat mode on this server."
