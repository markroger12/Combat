# ============================================================================
#  UltimateCombat - English messages (en_US)
#
#  Do not edit this file to customise texts - plugin updates may replace it.
#  Copy the keys you want to change into languages/custom.yml instead.
#
#  Formats per message:
#    key: "text"                 -> one chat line
#    key: ["line 1", "line 2"]   -> several chat lines
#    key: ""                     -> message disabled
#    key:
#      chat: "text"              -> chat (optional)
#      actionbar: "text"         -> action bar (optional)
#      title: "text"             -> title (optional)
#      subtitle: "text"          -> subtitle (optional)
#      fade-in: 10               -> title fade in (ticks)
#      stay: 40                  -> title duration (ticks)
#      fade-out: 10              -> title fade out (ticks)
#      sound: combat-start       -> sound preset from sounds.yml (optional)
#      prefix: true              -> put the prefix in front of chat lines
#
#  Colours: &a &l ..., hex &#FF5555, MiniMessage <gradient:...> (Paper).
#  {placeholders} are listed above each message; %PlaceholderAPI% works too.
# ============================================================================

general:
  # {module}
  module-disabled: "&cThis feature ({module}) is disabled on this server."
  no-permission: "&cYou do not have permission to do that."
  player-only: "&cOnly players can use this command."
  # {usage}
  usage: "&cUsage: &f{usage}"
  # {player}
  player-not-found: "&cPlayer &f{player} &cwas not found."
  # {value} {min} {max}
  invalid-number: "&cInvalid number &f{value}&c. Allowed: &f{min}&c - &f{max}&c."
  internal-error: "&cAn internal error occurred. Please tell an administrator (see console)."
  data-load-failed: "Your data could not be loaded. Please try again in a moment."
  storage-unavailable: "&cThe database is not available right now."

help:
  # {command}
  header: "&8&m          &r &cUltimateCombat &8- &f/{command} &8&m          "
  # {command} {description}
  entry: "&c/{command} &8- &7{description}"
  # {command} (sub-commands without a description below)
  entry-no-description: "&c/{command}"
  descriptions:
    help: "Show this help"
    reload: "Reload configuration files"
    validate: "Check every configuration file for problems"
    config: "Read, explain or change a setting"
    migrate: "Add new settings to your files (backup first)"
    backup: "Back up every configuration file"
    status: "Show plugin status"
    version: "Show the plugin version"
    debug: "Toggle live debug output"
    integrations: "Show detected plugin integrations"
    tag: "Put a player into combat"
    untag: "Remove a player from combat"
    combat: "Show combat status"
    combatlog: "Combat log history and pending punishments"
    ghosts: "Manage ghost players"
    border: "Manage built-in no-PvP zones"
    oldpvp: "Switch between classic and modern combat"
    togglepvp: "Turn your PvP on or off"
    pvp: "Admin PvP state management"
    grace: "New player protection"
    bounty: "Player bounties"
    stats: "Show PvP statistics"
    points: "Show PvP points"
    leaderboard: "Manage leaderboard holograms and signs"
    top: "Show the leaderboards"
    editor: "Open the in-game configuration editor"
    customtools: "List and give custom combat tools"
    deathmessages: "Hide or show death messages"
    deathback: "Return to your last death location"
    spawnpoint: "Manage spawn points"
    killrecaps: "Show your recent kill recaps"
    stattrak: "Weapon kill counters"
    sellhead: "Sell a head trophy"
    potionstack: "Stack the potions in your inventory"
    pvp-interval: "Show PvP time windows"
    apple: "Golden apple settings"
    enchantment: "Enchantment restrictions"
    rewards: "Trigger reward rules"
    abuse: "Anti-abuse review"
    resetstats: "Reset statistics"
    exportstats: "Export statistics to a CSV file"
    corpses: "Manage corpses"

gui:
  # {word}
  prompt-cancel-hint: "&7Type &f{word} &7to cancel."
  prompt-cancel-word: "cancel"
  prompt-cancelled: "&7Input cancelled."
  prompt-expired: "&cThe input request expired."

admin:
  # {version} {platform} {minecraft}
  version: "&7UltimateCombat &f{version} &7on &f{platform} {minecraft}"
  reload:
    # {target} {time}
    done: "&aReloaded &f{target} &ain &f{time}ms&a."
    # {count}
    issues: "&e{count} configuration problem(s) found - safe fallbacks are used. Run &f/uc validate&e."
    # {target}
    unknown-target: "&cUnknown reload target &f{target}&c. Use all, messages, a module name or a file name."
    # {file}
    restart-required: "&e{file} changed - this file only applies after a full server restart."
  validate:
    # {files}
    ok: "&aAll {files} configuration files are valid."
    # {count}
    header: "&e{count} configuration problem(s):"
    # {issue}
    entry: "&e- &7{issue}"
    # {issue}
    error: "&c- {issue}"
    # {count}
    more: "&7... and {count} more (see console)."
    # {count}
    missing: "&7{count} newer setting(s) are missing in your files (defaults used). &f/uc migrate &7adds them."
  config:
    # {file} {path}
    explain-header: "&c{file} &8> &f{path}"
    explain-line: "&7{line}"
    no-documentation: "&7No documentation found for this setting."
    # {value}
    current: "&7Current value: &f{value}"
    # {file} {path} {value} {source}
    value: "&c{file} &8> &f{path} &7= &f{value} &8({source})"
    # {path} {file}
    unknown-path: "&c{path} does not exist in {file}."
    # {path}
    is-section: "&c{path} is a section; change the settings inside it."
    # {value} {type}
    wrong-type: "&c'{value}' is not valid here. Expected: {type}."
    # {file}
    write-failed: "&cCould not write {file} (does it contain a YAML error?)."
    # {reason}
    rejected: "&cThe value was rejected and the old value restored: &7{reason}"
    # {file} {path} {value}
    updated: "&a{file} > {path} is now &f{value}&a (backup created)."
    # {reference}
    bad-reference: "&cUse file:path, for example combat.yml:pvp.duration-seconds (got {reference})."
  backup:
    # {count}
    done: "&aBacked up {count} files into plugins/UltimateCombat/backups/."
  migrate:
    # {file} {count}
    preview-file: "&7{file}: &f{count} &7new setting(s) would be added."
    # {file} {count}
    file: "&a{file}: added {count} setting(s)."
    # {file}
    failed: "&c{file}: could not be migrated (YAML error?)."
    # {change}
    structural: "&7{change}"
    # {count}
    done: "&aMigration finished, {count} setting(s) added. Backups are in backups/."
  status:
    # {version}
    header: "&8&m       &r &cUltimateCombat {version} status &8&m       "
    # {platform} {minecraft} {java}
    platform: "&7Server: &f{platform} {minecraft} &7Java &f{java}"
    # {type} {group} {redis}
    storage: "&7Storage: &f{type} &7group &f{group} &7Redis: {redis}"
    # {count} {list}
    modules-on: "&7Active modules ({count}): &a{list}"
    # {count} {list}
    modules-off: "&7Disabled modules ({count}): &8{list}"
    # {count}
    issues: "&7Configuration problems: &f{count}"
    # {count} {profiles}
    players: "&7Online players: &f{count} &7(loaded profiles: {profiles})"
  debug:
    enabled: "&aLive debug output enabled for you."
    disabled: "&7Live debug output disabled."
    console-hint: "&7Use config.yml -> debug.enabled for console debug output."
    # {count}
    counters-header: "&7Debug counters ({count}):"
    # {name} {value}
    counter: "&8- &7{name}: &f{value}"
  integrations:
    header: "&7Plugin integrations:"
    # {name} {id} {detail}
    active: "&a✔ {name} &8({id}) &7{detail}"
    disabled: "&8✖ {name} &8({id}) - disabled in integrations.yml"
    missing: "&8- {name} &8({id}) - not installed"
    failed: "&c✖ {name} &8({id}) &c- failed: {detail}"

