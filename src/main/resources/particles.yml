# ============================================================================
#  UltimateCombat - particles.yml
#  Every particle effect is defined once here as a named "preset". Other files
#  refer to presets by name (or use "none").
#
#  Preset fields:
#    enabled:  true/false   Show this effect at all.
#    particle: name         Particle type, e.g. HEART, FLAME, DUST, CRIT,
#                           ANGRY_VILLAGER (old names like REDSTONE or
#                           VILLAGER_ANGRY are converted automatically).
#                           Particles that need block/item data are not
#                           supported here; DUST (coloured) is.
#    count:    0-1000       Number of particles.
#    offset-x/y/z: 0-16     Random spread around the position, in blocks.
#    speed:    0-10         Particle speed (meaning depends on the particle).
#    y-offset: -5 to 5      Height above the target position (1.0 = chest).
#    color:    "#RRGGBB"    Only for DUST. Also accepts "R,G,B".
#    size:     0.01-4.0     Only for DUST.
# ============================================================================

config-version: 1

# Master switch for every particle effect of the plugin.
#
# true:  presets are shown as configured.
# false: the plugin never spawns particles.
#
# Default: true
enabled: true

# @user-map - you may add, rename or remove presets freely.
particles:
  combat-start:
    enabled: true
    particle: ANGRY_VILLAGER
    count: 4
    offset-x: 0.3
    offset-y: 0.3
    offset-z: 0.3
    speed: 0.0
    y-offset: 2.0
