    default: false
  ultimatecombat.bypass.restriction.creative:
    description: Bypass the 'creative' restriction
    default: false
  ultimatecombat.bypass.restriction.god-mode:
    description: Bypass the 'god-mode' restriction
    default: false
  ultimatecombat.bypass.restriction.vanish:
    description: Bypass the 'vanish' restriction
    default: false
  ultimatecombat.bypass.restriction.disguise:
    description: Bypass the 'disguise' restriction
    default: false
  ultimatecombat.bypass.restriction.teleport:
    description: Bypass the 'teleport' restriction
    default: false
  ultimatecombat.bypass.restriction.containers:
